name: Validate standalone sample bundles

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-standalone-sample-bundles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run sample case tests
        run: pytest -q

      - name: Verify AI agent action sample manifest
        working-directory: sample-cases/ai-agent-action-proof-run
        run: shasum -a 256 -c MANIFEST.sha256

      - name: Validate AI agent action sample JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          case = Path('sample-cases/ai-agent-action-proof-run')
          for name in [
              'AUTHORITY_MAP.json',
              'ACTION_BOUNDARY.json',
              'EVIDENCE_MANIFEST.json',
              'RECEIPT.json',
              'VERIFY_RESULT.json',
          ]:
              json.loads((case / name).read_text(encoding='utf-8'))

          receipt = json.loads((case / 'RECEIPT.json').read_text(encoding='utf-8'))
          verify_result = json.loads((case / 'VERIFY_RESULT.json').read_text(encoding='utf-8'))
          assert receipt['signature']['type'] == 'simulated'
          assert receipt['action']['production'] is False
          assert verify_result['result'] == 'pass_with_sample_limitations'
          PY
